<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业打卡系统 · 登录</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="login-page">
    <form class="login-card" id="loginForm">
      <div class="login-logo">🕐</div>
      <h1>企业打卡系统</h1>
      <p class="login-note">请输入您的账号登录</p>

      <label for="username">用户名</label>
      <input id="username" placeholder="请输入用户名" autocomplete="username" />

      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />

      <button type="submit" id="loginBtn">登录</button>
      <div id="loginFeedback" class="login-feedback" role="status"></div>
    </form>

    <script src="./login.js"></script>
  </body>
</html>
